databases:
  - name: pirate-blotter
    plan: free
    databaseName: piratespotter
    user: piratespotter

services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: piratespotter-api
    branch: main
    autoDeployTrigger: commit
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pirate-blotter
          property: connectionString
      - key: ADMIN_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: BOT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://piratespotter-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://piratespotter-frontend.onrender.com

  # ── Frontend static site ───────────────────────────────────────
  - type: web
    name: piratespotter-frontend
    branch: main
    autoDeployTrigger: commit
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: piratespotter-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Discord Bot ────────────────────────────────────────────────
  - type: web
    name: piratespotter-bot
    branch: main
    autoDeployTrigger: commit
    runtime: python
    rootDir: discord-bot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: BOT_SECRET
        sync: false
      - key: BACKEND_URL
        fromService:
          name: piratespotter-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
