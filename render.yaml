services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: piratespotter-api
    branch: main
    autoDeployTrigger: commit
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/reports

  # ── Frontend static site ───────────────────────────────────────
  - type: web
    name: piratespotter-frontend
    branch: main
    autoDeployTrigger: commit
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: piratespotter-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Discord Bot ────────────────────────────────────────────────
  - type: web
    name: piratespotter-bot
    branch: main
    autoDeployTrigger: commit
    runtime: python
    rootDir: discord-bot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: BACKEND_URL
        fromService:
          name: piratespotter-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
